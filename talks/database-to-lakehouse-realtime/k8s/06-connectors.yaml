# Debezium source: PostgreSQL inventory.customers -> Kafka, Avro schemas registered in Apicurio Registry
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: postgres-source
  labels:
    strimzi.io/cluster: lakehouse-connect
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  config:
    database.hostname: postgres
    database.port: 5432
    database.user: postgres
    database.password: postgres
    database.dbname: postgres
    topic.prefix: server1
    plugin.name: pgoutput
    table.include.list: inventory.customers
    schema.name.adjustment.mode: avro
    key.converter: io.apicurio.registry.utils.converter.AvroConverter
    key.converter.apicurio.registry.url: http://apicurio-registry:8080/apis/registry/v3
    key.converter.apicurio.registry.auto-register: true
    key.converter.apicurio.registry.find-latest: true
    value.converter: io.apicurio.registry.utils.converter.AvroConverter
    value.converter.apicurio.registry.url: http://apicurio-registry:8080/apis/registry/v3
    value.converter.apicurio.registry.auto-register: true
    value.converter.apicurio.registry.find-latest: true
---
# Apache Iceberg sink: Kafka -> Iceberg table via the REST catalog
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: iceberg-sink
  labels:
    strimzi.io/cluster: lakehouse-connect
spec:
  class: org.apache.iceberg.connect.IcebergSinkConnector
  tasksMax: 1
  config:
    topics: server1.inventory.customers
    iceberg.tables: inventory.customers
    iceberg.tables.auto-create-enabled: true
    iceberg.tables.evolve-schema-enabled: true
    # Freshness is bounded by this interval. The connector default is 300000 (5 minutes).
    iceberg.control.commit.interval-ms: 10000
    iceberg.catalog.type: rest
    iceberg.catalog.uri: http://iceberg-rest:8181
    iceberg.catalog.io-impl: org.apache.iceberg.aws.s3.S3FileIO
    iceberg.catalog.s3.endpoint: http://seaweedfs:8333
    iceberg.catalog.s3.path-style-access: true
    iceberg.catalog.s3.access-key-id: admin
    iceberg.catalog.s3.secret-access-key: password
    iceberg.catalog.client.region: us-east-1
    # The sink's control-topic consumer failed to stay in its group under the classic
    # rebalance protocol (UNKNOWN_MEMBER_ID on SyncGroup), so no data was ever committed.
    # Kafka 4.x's consumer protocol (KIP-848) keeps membership via background heartbeats.
    iceberg.kafka.group.protocol: consumer
    # Flatten Debezium change events and add a _cdc struct (op, ts, source, ...)
    transforms: debezium
    transforms.debezium.type: org.apache.iceberg.connect.transforms.DebeziumTransform
    key.converter: io.apicurio.registry.utils.converter.AvroConverter
    key.converter.apicurio.registry.url: http://apicurio-registry:8080/apis/registry/v3
    value.converter: io.apicurio.registry.utils.converter.AvroConverter
    value.converter.apicurio.registry.url: http://apicurio-registry:8080/apis/registry/v3
