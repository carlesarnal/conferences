# S3-compatible object storage (SeaweedFS) — MinIO images are no longer published.
# Signed S3 requests require an identity; these demo credentials match all clients.
apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-s3-config
data:
  s3.json: |
    {"identities": [{"name": "admin",
      "credentials": [{"accessKey": "admin", "secretKey": "password"}],
      "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.97
          args: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=128"]
          ports:
            - containerPort: 8333
          readinessProbe:
            tcpSocket:
              port: 8333
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            - name: s3-config
              mountPath: /etc/seaweedfs
      volumes:
        - name: data
          emptyDir: {}
        - name: s3-config
          configMap:
            name: seaweedfs-s3-config
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  selector:
    app: seaweedfs
  ports:
    - port: 8333
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-warehouse-bucket
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: aws
          image: amazon/aws-cli:2.37.4
          env:
            - name: AWS_ACCESS_KEY_ID
              value: admin
            - name: AWS_SECRET_ACCESS_KEY
              value: password
            - name: AWS_REGION
              value: us-east-1
          args: ["--endpoint-url", "http://seaweedfs:8333", "s3", "mb", "s3://warehouse"]
---
# Iceberg REST catalog (reference implementation; in-memory catalog metadata, demo only)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iceberg-rest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iceberg-rest
  template:
    metadata:
      labels:
        app: iceberg-rest
    spec:
      containers:
        - name: iceberg-rest
          image: apache/iceberg-rest-fixture:1.10.1
          env:
            - name: CATALOG_WAREHOUSE
              value: s3://warehouse/
            - name: CATALOG_IO__IMPL
              value: org.apache.iceberg.aws.s3.S3FileIO
            - name: CATALOG_S3_ENDPOINT
              value: http://seaweedfs:8333
            - name: CATALOG_S3_PATH__STYLE__ACCESS
              value: "true"
            - name: AWS_ACCESS_KEY_ID
              value: admin
            - name: AWS_SECRET_ACCESS_KEY
              value: password
            - name: AWS_REGION
              value: us-east-1
            # AWS SDK v2 default checksums (aws-chunked uploads) corrupt objects on
            # S3-compatible servers that don't support them. Only send when required.
            - name: AWS_REQUEST_CHECKSUM_CALCULATION
              value: when_required
            - name: AWS_RESPONSE_CHECKSUM_VALIDATION
              value: when_required
          ports:
            - containerPort: 8181
          readinessProbe:
            httpGet:
              path: /v1/config
              port: 8181
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: iceberg-rest
spec:
  selector:
    app: iceberg-rest
  ports:
    - port: 8181
