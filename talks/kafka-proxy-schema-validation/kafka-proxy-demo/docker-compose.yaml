services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  apicurio-registry:
    image: quay.io/apicurio/apicurio-registry:3.3.3
    container_name: apicurio-registry
    ports:
      - "8080:8080"

  # Started by scripts/01-register-schema.sh once the schema's contentId is known.
  kroxylicious:
    image: quay.io/kroxylicious/proxy:0.24.0
    container_name: kroxylicious
    command: ["--config", "/opt/demo/proxy-config.yaml"]
    volumes:
      - ./generated/proxy-config.yaml:/opt/demo/proxy-config.yaml:ro
    depends_on:
      kafka:
        condition: service_healthy
    profiles: ["proxy"]
